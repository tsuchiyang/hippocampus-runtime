[project]
name = "codex-memory-runtime"
version = "0.1.0a1"
description = "Hippocampus Runtime: experimental local memory and compaction recovery for Codex"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = []

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]

[project.scripts]
codex-memory-hook = "codex_memory.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_memory"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "portable", "docs", "README.md", "README.zh-CN.md", "LICENSE", "NOTICE.md", "SECURITY.md", "CONTRIBUTING.md", "CHANGELOG.md", "pyproject.toml", "uv.lock", ".python-version"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
