name: Private bounded Windows timing diagnosis (not a release gate)
on:
  push:
    branches: [codex/ci-timing-diagnostics]
permissions:
  contents: read
jobs:
  windows-diagnosis:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.12.1'
          enable-cache: false
      - run: uv python install 3.12.13 --no-bin --no-registry
      - run: uv sync --locked --python 3.12.13 --link-mode=copy
      - name: Same fixed nodes, system-temp then runner-temp, once each
        run: uv run --no-sync python -B scripts/diagnose_windows_ci.py
